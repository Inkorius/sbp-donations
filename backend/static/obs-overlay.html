<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Overlay - SBP Donations</title>
    <meta http-equiv="Permissions-Policy" content="autoplay=*">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: transparent !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #donations-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .donation-item {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: none;
            border: none;
            box-shadow: none;
            color: #fff;
            text-align: center;
            max-width: 80vw;
            padding: 0;
            margin: 0;
            opacity: 0;
            pointer-events: none;
        }

        /* Анимация появления */
        @keyframes slideIn {
            0% {
                opacity: 0;
                transform: translateX(100%);
            }
            10% {
                opacity: 1;
                transform: translateX(0);
            }
            90% {
                opacity: 1;
                transform: translateX(0);
            }
            100% {
                opacity: 0;
                transform: translateX(-100%);
            }
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.94); }
            12% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            88% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Анимация для больших сумм */
        @keyframes bigAmount {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Элементы доната */
        .donation-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
        }

        .donor-name {
            font-weight: 700;
            font-size: 1em;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85), 0 0 4px rgba(0, 0, 0, 0.9);
        }

        .donation-amount {
            font-weight: 800;
            font-size: 1.25em;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85), 0 0 4px rgba(0, 0, 0, 0.9);
        }

        .donation-message {
            font-size: 0.7em;
            line-height: 1.35;
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85), 0 0 4px rgba(0, 0, 0, 0.9);
        }

        .new-indicator {
            display: none;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Контролы для настройки (только для отладки) */
        .controls {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 1000;
            display: none;
        }

        .controls.active {
            display: block;
        }

        /* Позиционирование через классы */
        .position-top-left { top: 20px; left: 20px; }
        .position-top-right { top: 20px; right: 20px; }
        .position-bottom-left { bottom: 20px; left: 20px; }
        .position-bottom-right { bottom: 20px; right: 20px; }
        .position-center { top: 50%; left: 50%; transform: translate(-50%, -50%); }

        .connection-status {
            display: none;
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 999;
        }

        body.debug .connection-status {
            display: block;
        }

        /* Тема "Минимализм" */
        .theme-minimal .donation-item {
            background: rgba(0, 0, 0, 0.8);
            border-left: 3px solid #7c4dff;
            box-shadow: none;
        }

        .theme-minimal .donation-amount {
            color: #7c4dff;
        }

        /* Тема "Яркая" */
        .theme-bright .donation-item {
            background: linear-gradient(135deg, #ff4081 0%, #7c4dff 100%);
            border-left: 5px solid #ffeb3b;
        }
    </style>
</head>
<body>
    <!-- Контейнер для донатов -->
    <div id="donations-container"></div>
    <audio id="alert-player" preload="auto" playsinline></audio>
    <audio id="voice-player" preload="auto" playsinline></audio>
    <audio id="unlock-player" preload="auto" playsinline autoplay muted loop></audio>

    <!-- Статус подключения -->
    <div class="connection-status" id="connection-status">
        <span id="status-text">Подключение...</span>
    </div>

    <!-- Контролы для отладки (Ctrl+D чтобы показать/скрыть) -->
    <div class="controls" id="debug-controls">
        <div>Донатов: <span id="counter">0</span></div>
        <div>Режим: <span id="mode">Инициализация</span></div>
        <div>Статус: <span id="status">Загрузка...</span></div>
        <div>Стример ID: <span id="streamer-id">-</span></div>
        <div>
            <button onclick="testDonation()">Тест донат</button>
            <button onclick="clearDonations()">Очистить</button>
            <button onclick="toggleTheme()">Сменить тему</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const config = {
            username: urlParams.get('user') || '',
            duration: parseInt(urlParams.get('duration')) || 10000,
            position: urlParams.get('position') || 'center',
            maxDonations: parseInt(urlParams.get('max')) || 1,
            animation: urlParams.get('animation') || 'fadeIn',
            sound: urlParams.has('sound'),
            tts: urlParams.has('tts') && urlParams.get('tts') !== '0',
            font: urlParams.get('font') || 'Segoe UI, Arial, sans-serif',
            size: parseInt(urlParams.get('size')) || 56,
            color: '#' + (urlParams.get('color') || 'ffffff').replace('#', ''),
            theme: urlParams.get('theme') || 'default',
            debug: urlParams.has('debug') && urlParams.get('debug') !== '0',
            useRealtime: !urlParams.has('no-realtime')
        };

        let currentProfileId = null;
        let donationsCount = 0;
        const donationsQueue = [];
        const seenDonationIds = new Set();
        let currentTheme = config.theme;
        let connectionMode = 'initializing';
        let lastCheckMs = Date.now();
        let pollingInterval = null;
        let overlaySocket = null;
        let alertSoundUrl = null;
        const pendingDonations = [];
        let overlayBusy = false;
        let sharedAudioCtx = null;

        function apiUrl(path) {
            return path;
        }

        document.addEventListener('DOMContentLoaded', initializeOverlay);

        async function initializeOverlay() {
            const fontName = (config.font || 'Arial').replace(/["']/g, '').trim();
            document.body.style.fontFamily = '"' + fontName + '", sans-serif';
            document.body.style.setProperty('--overlay-size', config.size + 'px');
            document.body.style.setProperty('--overlay-color', config.color);
            if (['Unbounded', 'Montserrat', 'Rubik'].includes(fontName)) {
                const fontLink = document.createElement('link');
                fontLink.rel = 'stylesheet';
                fontLink.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(fontName) + ':wght@600;800&display=swap';
                document.head.appendChild(fontLink);
            }
            unlockAudio();
            armAutoplay();
            updateStatus('Поиск стримера...');
            if (config.debug) {
                document.body.classList.add('debug');
                document.getElementById('debug-controls').classList.add('active');
            }
            if (!config.username) {
                updateStatus('В ссылке нет ?user=', 'error');
                showErrorMessage('Добавьте в ссылку ?user=ваш_ник');
                return;
            }

            try {
                const profile = await fetch(apiUrl('/api/profiles/' + encodeURIComponent(config.username))).then((r) => {
                    if (!r.ok) throw new Error('not found');
                    return r.json();
                });

                currentProfileId = profile.id;
                alertSoundUrl = profile.alert_sound_url
                    ? new URL(profile.alert_sound_url, window.location.origin).href
                    : null;
                document.getElementById('streamer-id').textContent = profile.id.substring(0, 8) + '...';
                updateStatus(
                    'Стример: ' + (profile.display_name || profile.username)
                    + (config.tts ? ', озвучка вкл' : ', озвучка выкл')
                    + (alertSoundUrl ? ', свой звук есть' : ', своего звука нет'),
                    'success'
                );
                document.body.classList.add('theme-' + currentTheme);
                lastCheckMs = Date.now();

                setupPolling(profile.id);
                if (config.useRealtime) setupRealtime(profile.id);
            } catch (error) {
                updateStatus('Стример не найден', 'error');
                showErrorMessage('Стример "' + config.username + '" не найден');
            }
        }

        function setupRealtime(profileId) {
            updateStatus('Подключение к WebSocket...');
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const socket = new WebSocket(proto + '//' + location.host + '/ws/donations?profile_id=' + encodeURIComponent(profileId));
            overlaySocket = socket;

            socket.onopen = () => {
                connectionMode = 'realtime';
                document.getElementById('mode').textContent = 'WebSocket + опрос';
                updateStatus('Оверлей подключен', 'success');
            };
            socket.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'ping') return;
                if ((msg.type === 'donation.confirmed' || msg.type === 'donation.new') && msg.data) addDonation(msg.data);
            };
            socket.onclose = () => {
                if (connectionMode === 'realtime') {
                    connectionMode = 'initializing';
                    setupPolling(profileId);
                }
            };
            socket.onerror = () => setupPolling(profileId);
        }

        function setupPolling(profileId) {
            if (pollingInterval) return;
            document.getElementById('mode').textContent = connectionMode === 'realtime' ? 'WebSocket + опрос' : 'Опрос';

            async function checkNewDonations() {
                try {
                    const res = await fetch(apiUrl('/api/donations?profile_id=' + encodeURIComponent(profileId) + '&since_ms=' + lastCheckMs + '&status=confirmed&limit=50'));
                    const rows = await res.json();
                    if (!res.ok || !Array.isArray(rows) || !rows.length) return;
                    rows.forEach((donation) => addDonation(donation));
                    lastCheckMs = Date.now();
                } catch (error) {
                    console.error(error);
                }
            }
            pollingInterval = setInterval(checkNewDonations, 2000);
            checkNewDonations();
        }

        // ========== ДОБАВЛЕНИЕ ДОНАТА НА ЭКРАН ==========
        function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
        }

        const SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';

        async function unlockAudio() {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (Ctx) {
                if (!sharedAudioCtx) sharedAudioCtx = new Ctx();
                if (sharedAudioCtx.state === 'suspended') {
                    try { await sharedAudioCtx.resume(); } catch (err) {}
                }
                try {
                    const buffer = sharedAudioCtx.createBuffer(1, 1, 22050);
                    const node = sharedAudioCtx.createBufferSource();
                    node.buffer = buffer;
                    node.connect(sharedAudioCtx.destination);
                    node.start();
                } catch (err) {}
            }
            const unlockPlayer = document.getElementById('unlock-player');
            if (unlockPlayer && !unlockPlayer.src) {
                unlockPlayer.src = SILENT_WAV;
            }
            if (unlockPlayer) {
                unlockPlayer.muted = true;
                unlockPlayer.play().catch(() => {});
            }
        }

        function armAutoplay() {
            const retry = () => unlockAudio();
            ['pointerdown', 'mousedown', 'keydown', 'touchstart', 'click'].forEach((name) => {
                document.addEventListener(name, retry, true);
            });
            document.addEventListener('visibilitychange', retry);
            window.addEventListener('focus', retry);
            window.addEventListener('obsSourceVisibleChanged', retry);
            window.addEventListener('obsSourceActiveChanged', retry);
            window.addEventListener('obsSceneChanged', retry);
            if (window.obsstudio && typeof window.obsstudio.onVisibilityChange === 'function') {
                window.obsstudio.onVisibilityChange(retry);
            }
            setInterval(() => {
                if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') unlockAudio();
            }, 2000);
        }

        function donationSpeechText(donation) {
            const amount = formatAmount(donation.amount);
            const message = donation.message ? '. ' + donation.message : '';
            return ((donation.donor_name || 'Кто-то') + ' задонатил ' + amount + ' рублей' + message).slice(0, 500);
        }

        function playThroughElement(player, src, maxMs) {
            return new Promise((resolve) => {
                if (!player || !src) {
                    resolve();
                    return;
                }
                let finished = false;
                const finish = () => {
                    if (finished) return;
                    finished = true;
                    player.onended = null;
                    player.onerror = null;
                    resolve();
                };
                player.pause();
                player.muted = false;
                player.volume = 1;
                player.src = src;
                player.onended = finish;
                player.onerror = finish;
                player.play().catch(() => {
                    setTimeout(() => player.play().catch(finish), 300);
                });
                setTimeout(finish, maxMs || 20000);
            });
        }

        async function playAudio(src, player) {
            if (!src) return;
            await unlockAudio();
            const el = player || document.getElementById('voice-player');
            await playThroughElement(el, src, player && player.id === 'alert-player' ? 8000 : 20000);
        }

        function addDonation(donation) {
            if (!donation || donation.status !== 'confirmed') return;
            if (donation.id && seenDonationIds.has(donation.id)) return;
            if (donation.id) seenDonationIds.add(donation.id);
            pendingDonations.push(donation);
            processOverlayQueue();
        }

        async function processOverlayQueue() {
            if (overlayBusy) return;
            overlayBusy = true;
            while (pendingDonations.length) {
                const donation = pendingDonations.shift();
                const ttsUrl = config.tts
                    ? apiUrl('/api/tts?text=' + encodeURIComponent(donationSpeechText(donation)) + '&voice=' + encodeURIComponent(donation.tts_voice || 'irina'))
                    : null;
                const voicePlayer = document.getElementById('voice-player');
                const alertPlayer = document.getElementById('alert-player');
                if (voicePlayer) {
                    voicePlayer.pause();
                    voicePlayer.removeAttribute('src');
                }
                await sleep(5000);
                if (alertSoundUrl) {
                    await playAudio(alertSoundUrl, alertPlayer);
                }
                await presentDonation(donation, ttsUrl);
            }
            overlayBusy = false;
        }

        async function presentDonation(donation, ttsUrl) {
            donationsCount++;
            document.getElementById('counter').textContent = donationsCount;

            const donationEl = document.createElement('div');
            donationEl.className = 'donation-item';
            donationEl.style.fontSize = config.size + 'px';
            donationEl.style.color = config.color;
            donationEl.innerHTML = `
                <div class="donation-header">
                    <div class="donor-name">${escapeHtml(donation.donor_name)}</div>
                    <div class="donation-amount">${formatAmount(donation.amount)} ₽</div>
                </div>
                ${donation.message ? `<div class="donation-message">${escapeHtml(donation.message)}</div>` : ''}
            `;

            const container = document.getElementById('donations-container');
            container.appendChild(donationEl);
            donationsQueue.push(donationEl);
            if (donationsQueue.length > config.maxDonations) {
                const oldDonation = donationsQueue.shift();
                if (oldDonation.parentNode) {
                    oldDonation.parentNode.removeChild(oldDonation);
                }
            }

            donationEl.style.animation = `${config.animation} ${config.duration}ms forwards`;
            await Promise.all([
                ttsUrl ? playAudio(ttsUrl, document.getElementById('voice-player')) : Promise.resolve(),
                sleep(config.duration),
            ]);

            const index = donationsQueue.indexOf(donationEl);
            if (index > -1) donationsQueue.splice(index, 1);
            if (donationEl.parentNode) {
                donationEl.style.opacity = '0';
                donationEl.style.transition = 'opacity 0.5s';
                await sleep(500);
                if (donationEl.parentNode) donationEl.parentNode.removeChild(donationEl);
            }
        }

        // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatAmount(amount) {
            return parseFloat(amount).toFixed(0);
        }

        function updateStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            const statusTextEl = document.getElementById('status-text');
            
            if (statusEl) statusEl.textContent = message;
            if (statusTextEl) statusTextEl.textContent = message;
            
            // Цвет в зависимости от типа
            const connectionStatus = document.getElementById('connection-status');
            if (connectionStatus) {
                connectionStatus.style.background = 
                    type === 'error' ? 'rgba(244, 67, 54, 0.8)' :
                    type === 'success' ? 'rgba(76, 175, 80, 0.8)' :
                    type === 'warning' ? 'rgba(255, 152, 0, 0.8)' :
                    'rgba(0, 0, 0, 0.7)';
            }
            
            console.log(`📢 ${message}`);
        }

        function showErrorMessage(message) {
            const errorEl = document.createElement('div');
            errorEl.className = `donation-item position-center`;
            errorEl.innerHTML = `
                <div style="color: #ff4081; text-align: center;">
                    <strong>⚠️ Ошибка</strong><br>
                    ${message}
                </div>
            `;
            errorEl.style.background = 'rgba(0, 0, 0, 0.9)';
            errorEl.style.opacity = '1';
            errorEl.style.animation = 'none';
            document.getElementById('donations-container').appendChild(errorEl);
        }

        // ========== ФУНКЦИИ ОТЛАДКИ ==========
        function testDonation() {
            const testNames = ['Иван', 'Мария', 'Алексей', 'Дмитрий', 'Анна'];
            const testMessages = [
                'Спасибо за стрим!',
                'Отличный контент!',
                'Продолжайте в том же духе!',
                'Лучший стример!',
                'Забирайте на кофе :)'
            ];
            
            const testDonation = {
                status: 'confirmed',
                donor_name: testNames[Math.floor(Math.random() * testNames.length)],
                amount: Math.floor(Math.random() * 2000) + 10,
                message: testMessages[Math.floor(Math.random() * testMessages.length)]
            };
            
            console.log('🧪 Тестовый донат:', testDonation);
            addDonation(testDonation);
        }

        function clearDonations() {
            const container = document.getElementById('donations-container');
            while (container.firstChild) {
                container.removeChild(container.firstChild);
            }
            donationsQueue.length = 0;
            donationsCount = 0;
            document.getElementById('counter').textContent = '0';
            console.log('🧹 Все донаты очищены');
        }

        function toggleTheme() {
            const themes = ['default', 'minimal', 'bright'];
            const currentIndex = themes.indexOf(currentTheme);
            const nextTheme = themes[(currentIndex + 1) % themes.length];
            
            // Удаляем старую тему
            document.body.classList.remove(`theme-${currentTheme}`);
            // Добавляем новую
            document.body.classList.add(`theme-${nextTheme}`);
            
            currentTheme = nextTheme;
            updateStatus(`🎨 Тема изменена: ${nextTheme}`);
        }

        // ========== ГЛОБАЛЬНЫЕ СОБЫТИЯ ==========
        // Показать/скрыть контролы по Ctrl+D
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'd') {
                document.getElementById('debug-controls').classList.toggle('active');
                console.log('🔧 Отладка ' + (document.getElementById('debug-controls').classList.contains('active') ? 'включена' : 'отключена'));
            }
        });

        // Информация о конфигурации при загрузке
        console.log('🚀 OBS Overlay запущен с конфигурацией:', config);
        console.log('💡 Нажмите Ctrl+D для показа панели отладки');
        console.log('🌐 URL параметры:');
        console.log('  ?user=username       - имя стримера');
        console.log('  ?duration=10000      - время показа в ms');
        console.log('  ?position=top-right  - позиция (top-left, top-right, etc)');
        console.log('  ?max=5               - максимум донатов одновременно');
        console.log('  ?animation=slideIn   - анимация (slideIn, fadeIn)');
        console.log('  ?sound=true          - включить звук');
        console.log('  ?theme=default       - тема (default, minimal, bright)');
        console.log('  ?debug=true          - показать панель отладки');
        console.log('  ?no-realtime=true    - отключить Realtime (использовать только polling)');
    </script>
</body>
</html>
